<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Painel</title>
</head>
<body>
    <div class="cabecalho">
        <h1 class="titulo">PAINEL DE MONITORAMENTO</h1>
        <p class="status">Status:</p>
        <span id="status">--</span>
    </div>
    <div class="containerMonitoramento">
        <div class="dado1">
            <p>Chaves</p>
            <span id="chave">--</span>
        </div>
        <div class="dado2">
            <p>Operações</p>
            <span id="operacoes">--</span>
        </div>
        <div class="dado3">
            <p>Disco</p>
            <span id="disco">--</span>
        </div>
        <div class="dado4">
            <p>Tempo no ar</p>
            <span id="tempoNoAr">--</span>
        </div>
    </div>
    <div class="rodape">
        <p class="titulo2">Última atualização</p>
        <span id="ultimaAtualizacao">--</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
